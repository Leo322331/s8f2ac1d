/* ---------------- 条形图 ---------------- */
function hbars(rows, fmt, extraCls) {
  if (!rows.length) return '<div class="ph">当前筛选下没有数据</div>';
  var max = 0;
  rows.forEach(function (r) { max = Math.max(max, Math.abs(r.v)); });
  if (!max) max = 1;
  return rows.map(function (r) {
    var w = Math.abs(r.v) / max * 100;
    var cls = (r.v < 0 ? "neg" : "") + (extraCls ? " " + extraCls : "");
    return '<div class="hrow"><div class="nm" title="' + esc(r.nm) + '">' + esc(r.nm) + '</div>' +
      '<div class="track"><i class="' + cls + '" style="width:' + w.toFixed(1) + '%"></i></div>' +
      '<div class="val">' + fmt(r) + '</div></div>';
  }).join("");
}

/* ---------------- 月度趋势（SVG） ---------------- */
function chartMonthly(list) {
  var revs = [], gms = [];
  for (var i = 0; i < NMON; i++) {
    var r = 0, c = 0;
    list.forEach(function (x) { r += x.rev[i] || 0; c += x.cost[i] || 0; });
    revs.push(r); gms.push(r ? (r - c) / r : null);
  }
  var W = 660, Hh = 240, PL = 62, PR = 54, PT = 18, PB = 34;
  var iw = W - PL - PR, ih = Hh - PT - PB;
  var maxRev = Math.max.apply(null, revs.concat([1]));
  var gmList = gms.filter(function (x) { return x !== null; });
  var maxGm = gmList.length ? Math.max.apply(null, gmList) : 0.3;
  var minGm = gmList.length ? Math.min.apply(null, gmList) : 0;
  if (maxGm === minGm) maxGm = minGm + 0.05;
  var pad = (maxGm - minGm) * 0.35;
  var gTop = maxGm + pad, gBot = Math.max(0, minGm - pad);

  var bw = Math.min(64, iw / NMON * 0.52);
  var s = '<svg viewBox="0 0 ' + W + ' ' + Hh + '" width="100%" height="' + Hh + '" role="img">';
  for (var g = 0; g <= 4; g++) {
    var y = PT + ih * g / 4;
    var val = maxRev * (1 - g / 4);
    s += '<line x1="' + PL + '" y1="' + y + '" x2="' + (W - PR) + '" y2="' + y + '" stroke="#eef1f3"/>';
    s += '<text x="' + (PL - 8) + '" y="' + (y + 4) + '" font-size="10.5" fill="#6b7280" text-anchor="end">' +
         (val / 10000).toFixed(0) + '万</text>';
    var gv = gTop - (gTop - gBot) * g / 4;
    s += '<text x="' + (W - PR + 8) + '" y="' + (y + 4) + '" font-size="10.5" fill="#0f766e" text-anchor="start">' +
         (gv * 100).toFixed(0) + '%</text>';
  }
  var step = iw / NMON;
  var pts = [];
  for (var i2 = 0; i2 < NMON; i2++) {
    var cx = PL + step * i2 + step / 2;
    var bh = maxRev ? revs[i2] / maxRev * ih : 0;
    s += '<rect x="' + (cx - bw / 2).toFixed(1) + '" y="' + (PT + ih - bh).toFixed(1) +
         '" width="' + bw.toFixed(1) + '" height="' + Math.max(0, bh).toFixed(1) + '" rx="3" fill="#0f766e" opacity=".88"/>';
    s += '<text x="' + cx.toFixed(1) + '" y="' + (PT + ih - bh - 6).toFixed(1) +
         '" font-size="11" fill="#111827" text-anchor="middle">' + (revs[i2] / 10000).toFixed(0) + '万</text>';
    s += '<text x="' + cx.toFixed(1) + '" y="' + (Hh - 12) + '" font-size="11.5" fill="#6b7280" text-anchor="middle">' +
         MONTHS[i2] + '</text>';
    if (gms[i2] !== null) {
      var gy = PT + ih - (gms[i2] - gBot) / (gTop - gBot) * ih;
      pts.push([cx, gy]);
    }
  }
  if (pts.length > 1) {
    s += '<polyline fill="none" stroke="#2563eb" stroke-width="2" points="' +
         pts.map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ") + '"/>';
  }
  pts.forEach(function (p) {
    s += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3.6" fill="#fff" stroke="#2563eb" stroke-width="2"/>';
  });
  s += '</svg><div style="font-size:11.5px;color:#6b7280;margin-top:2px">' +
       '<span style="color:#0f766e">■</span> 收入（左轴）　<span style="color:#2563eb">—</span> 毛利率（右轴）</div>';
  return s;
}

function renderCharts(list) {

    }).filter(function (r) { return Math.abs(r.v) > 0.005; });

    var top = list.filter(function (c) { return c.hasRev; })

  document.getElementById("c3").innerHTML = hbars(depts, function (r) {
    return nf(r.rev / 10000, 0) + '万<div style="font-size:11.5px;color:#0f766e">' + pct(r.rate) + '</div>';
  });
}

function sortValue(col, c, m) {
  if (col.no) return 0;
  return col.get(c, m);
}
function renderTable(list) {
  var rows = list.map(function (c) { return { c: c, m: metrics(c) }; });
  var rankOrder = rows.slice().sort(function (a, b) {
    var x = a.m.rate === null ? -9 : a.m.rate, y = b.m.rate === null ? -9 : b.m.rate;
    return y - x;
  });
  var rankMap = new Map();
  var rk = 0;
  rankOrder.forEach(function (r) {
    if (r.m.rate === null || Math.abs(r.m.rev) <= 0.005) return;
    rankMap.set(r.c.n, ++rk);
  });

  var key = state.sortKey, dir = state.sortDir;
  rows.sort(function (a, b) {
    var x, y;
    if (key === "#") { x = rankMap.get(a.c.n) || 1e9; y = rankMap.get(b.c.n) || 1e9; }
    else {
      var col = COLS.filter(function (c2) { return c2.k === key; })[0];
      if (!col) return 0;
      x = sortValue(col, a.c, a.m); y = sortValue(col, b.c, b.m);
      if (x === null || x === undefined) x = -Infinity;
      if (y === null || y === undefined) y = -Infinity;
      if (typeof x === "string" || typeof y === "string") { x = String(x); y = String(y); return dir * x.localeCompare(y, "zh"); }
    }
    return dir * (x - y);
  });

  var th = COLS.map(function (col) {
    var ar = state.sortKey === col.k ? (state.sortDir < 0 ? " ↓" : " ↑") : "";
    return '<th class="' + (col.tl ? "tl" : "") + '" data-k="' + esc(col.k) + '">' + esc(col.k) +
      '<span class="ar">' + ar + '</span></th>';
  }).join("");
  document.querySelector("#tbl thead").innerHTML = "<tr>" + th + "</tr>";

  var body = rows.map(function (r) {
    var tds = COLS.map(function (col) {
      var v = col.no ? (rankMap.get(r.c.n) || "") : col.txt(r.c, r.m);
      return '<td class="' + (col.tl ? "tl" : "") + ' ' + (col.cls || "") + '">' + v + '</td>';
    }).join("");
    return '<tr data-name="' + esc(r.c.n) + '">' + tds + "</tr>";
  }).join("");

  var ua = "";
  if (feeOn()) {
    var gp2 = gapRows();
    ['nomatch', 'unalloc'].forEach(function (b) {
      var sel = gp2.filter(function (g) { return g.b === b; });
      if (!sel.length) return;
      var s = sel.reduce(function (x, g) { return x + g.f; }, 0);
      var sl = sel.reduce(function (x, g) { return x + g.l; }, 0);
      var lbl = b === 'nomatch'
        ? '未匹配合并/关联户费用（待主客户对照表）'
        : '未分摊战区费用（待战区总核销）';
      var sub = b === 'nomatch' ? '合并/关联户' : '战区级';
      ua += '<tr class="unallocrow no-drill"><td class="tl"></td>' +
        '<td class="tl">' + lbl + '　<span style="font-size:11.5px">' + sel.length + ' 项</span></td>' +
        '<td class="tl">' + sub + '</td><td class="tl">—</td><td class="tl">—</td><td class="tl">—</td>' +
        '<td>—</td><td>—</td><td>—</td><td>—</td>' +
        '<td>' + nf(s, 0) + '</td><td>—</td>' +
        '<td>' + (sl ? nf(sl, 0) : '—') + '</td><td>—</td><td>—</td><td>—</td><td></td></tr>';
    });
  }
  document.querySelector("#tbl tbody").innerHTML = body + ua;

  document.getElementById("tblCount").textContent =
    "（" + nf(rows.length, 0) + " 家，按销售利润率排名）";
  document.getElementById("tblNote").innerHTML =
    "收入合计 " + nf(total(list).rev, 0) + " 元" +
    (feeOn() ? "｜客户费用合计 " + nf(total(list).feeNB, 0) + " 元｜未分摊战区费用 " + nf(D.unalloc.feeT, 0) + " 元" : "");
}

    }).join("") + "</tbody></table></div>";

      .forEach(function (bb) {
        var sel = gp3.filter(function (g) { return g.b === bb[0]; });
        if (!sel.length) return;
        var sv = sel.reduce(function (x, g) { return x + g.f; }, 0);
        var ua = [bb[1], "—", "", "", "", "", "", "", "", "", rr(sv), "", "", "", "", "", ""];
        lines.push(ua.map(function (v) { return '"' + v + '"'; }).join(","));
      });
  }
  function rr(v, d) { return (v === null || v === undefined || isNaN(v)) ? "" : Number(v).toFixed(d === undefined ? 2 : d); }
  var blob = new Blob(["\uFEFF" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "客户销售利润率_" + (state.period === "fy" ? "财年累计" : MONTHS[state.period]) + ".csv";
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
}

/* ---------------- 初始化 ---------------- */
function uniq(arr) { return Array.from(new Set(arr.filter(function (v) { return v; }))).sort(function (a, b) { return a.localeCompare(b, "zh"); }); }
function buildMulti(id, key, values) {
  var box = document.querySelector("#" + id + " .msbody");
  box.innerHTML = values.map(function (v) {
    return '<label><input type="checkbox" value="' + esc(v) + '">' + esc(v) + "</label>";
  }).join("") + '<div class="msfoot"><button class="btn" data-all="1">全选</button>' +
    '<button class="btn" data-none="1">清空</button></div>';
  box.addEventListener("change", function (e) {
    if (e.target.type === "checkbox") {
      if (e.target.checked) state.sets[key][e.target.value] = 1; else delete state.sets[key][e.target.value];
      updateMultiLabel(id, values.length); render();
    }
  });
  box.addEventListener("click", function (e) {
    var t = e.target.closest("button"); if (!t) return;
    e.preventDefault();
    box.querySelectorAll("input[type=checkbox]").forEach(function (cb) {
      var on = t.hasAttribute("data-all");
      cb.checked = on;
      if (on) state.sets[key][cb.value] = 1; else delete state.sets[key][cb.value];
    });
    updateMultiLabel(id, values.length); render();
  });
}
function updateMultiLabel(id, totalAll) {
  var key = { msDepts: "depts", msRegions: "regions", msSales: "sales", msChannels: "channels" }[id];
  var n = Object.keys(state.sets[key]).length;
  var label = { msDepts: "部门", msRegions: "地区", msSales: "业务员", msChannels: "渠道" }[id];
  document.querySelector("#" + id + " > summary").innerHTML =
    label + (n ? ' <span class="cnt">' + n + "</span>" : " 全部");
}

function render() {
  var list = filtered();
  renderKpis(list);
  renderCharts(list);
  renderTable(list);
}

function init() {
  document.getElementById("title").textContent = D.meta.title;
  document.getElementById("subtitle").textContent =
    "数据源：" + D.meta.source + "　｜　范围：" + D.meta.scope + "　｜　财年自 " + D.meta.fyStart +
    "　｜　生成时间：" + D.meta.generated;
  document.getElementById("banner").innerHTML =
    "① 销售费用目前<b>只有 Q1 合计</b>（客户费用表未分月）——选「财年累计」可看费用率和销售利润率，" +
    "选单月时这三项不可用，需要补一份分月的客户费用。<br>" +
    "② <b>主客户合并对照表尚未接入</b>：客户费用表里有 <b>" + nf(D.meta.feeGapNoMatch, 0) +
    " 元</b>费用挂在「万辰集团」「厦门坤旺达」这类合并/关联户名下，跟出货表的实际户名对不上，" +
    "已单列为表格倒数第二行；拿到对照表后这部分会并回具体客户。<br>" +
    "③ 未分摊到客户的战区级费用 <b>" + nf(D.meta.feeUnalloc, 0) + " 元</b>（主要是各区返点，待战区总核销）" +
    "单列在表格最后一行，不计入客户合计；部门级汇总已含。" +
    (Math.abs(D.meta.barcode) < 0.005 ? "<br>④ 本期条码费为 0，\"含条码费／不含条码费\"两套口径数值相同。" : "");

  var sel = document.getElementById("fPeriod");
  sel.innerHTML = '<option value="fy">财年累计（3-5月）</option>' +
    MONTHS.map(function (m, i) { return '<option value="' + i + '">' + m + "</option>"; }).join("");
  sel.onchange = function () { state.period = this.value === "fy" ? "fy" : parseInt(this.value, 10); render(); };

  buildMulti("msDepts", "depts", uniq(D.customers.filter(function (c) { return c.hasRev; }).map(function (c) { return c.d; })));
  buildMulti("msRegions", "regions", uniq(D.customers.filter(function (c) { return c.hasRev; }).map(function (c) { return c.r; })));
  buildMulti("msSales", "sales", uniq(D.customers.filter(function (c) { return c.hasRev; }).map(function (c) { return c.s; })));
  buildMulti("msChannels", "channels", uniq(D.customers.filter(function (c) { return c.hasRev; }).map(function (c) { return c.c; })));
  ["msDepts", "msRegions", "msSales", "msChannels"].forEach(function (id) { updateMultiLabel(id); });

  document.addEventListener("click", function (e) {
    if (!e.target.closest("details.ms")) {
      document.querySelectorAll("details.ms[open]").forEach(function (d) { d.removeAttribute("open"); });
    }
  });

  document.getElementById("fQ").oninput = function () { state.q = this.value.trim(); render(); };
  document.getElementById("fOnlyRev").onchange = function () { state.onlyRev = this.checked; render(); };
  document.getElementById("btnReset").onclick = function () {
    state.sets = { depts: {}, regions: {}, sales: {}, channels: {} };
    state.q = ""; state.onlyRev = true; state.period = "fy";
    state.sortKey = "rate"; state.sortDir = -1;
    document.getElementById("fQ").value = "";
    document.getElementById("fOnlyRev").checked = true;
    document.getElementById("fPeriod").value = "fy";
    document.querySelectorAll(".msbody input[type=checkbox]").forEach(function (cb) { cb.checked = false; });
    ["msDepts", "msRegions", "msSales", "msChannels"].forEach(function (id) { updateMultiLabel(id); });
    render();
  };
  document.getElementById("btnCsv").onclick = exportCsv;
  document.getElementById("btnPrint").onclick = function () { window.print(); };

  document.querySelector("#tbl thead").onclick = function (e) {
    var th = e.target.closest("th"); if (!th) return;
    var k = th.getAttribute("data-k");
    if (state.sortKey === k) state.sortDir = -state.sortDir; else { state.sortKey = k; state.sortDir = -1; }
    renderTable(filtered());
  };
  document.querySelector("#tbl tbody").onclick = function (e) {
    var tr = e.target.closest("tr"); if (!tr || tr.classList.contains("unallocrow")) return;
    openCust(tr.getAttribute("data-name"));
  };
  document.getElementById("mClose").onclick = function () { document.getElementById("modal").classList.remove("on"); };
  document.getElementById("modal").onclick = function (e) {
    if (e.target === this) this.classList.remove("on");
  };
  document.querySelectorAll(".tabs button").forEach(function (b) {
    b.onclick = function () {
      curTab = b.getAttribute("data-tab");
      document.querySelectorAll(".tabs button").forEach(function (x) { x.classList.toggle("on", x === b); });
      drawTab();
    };
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") document.getElementById("modal").classList.remove("on");
  });

  render();
}
init();
})();

</script>
